<svg xmlns="http://www.w3.org/2000/svg" width="920" height="374" viewBox="0 0 920 374" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><text x="24.0" y="34.0" font-size="18" text-anchor="start" fill="#1f2328" font-weight="600">Where Vx's wrong fit verdicts came from</text><text x="24.0" y="56.0" font-size="13" text-anchor="start" fill="#656d76" font-weight="normal">Each step fixes one input to the same Vx check; 128 configurations compared with vLLM 0.31 at its defaults.</text><text x="286.0" y="102.0" font-size="14" text-anchor="end" fill="#1f2328" font-weight="600">fleet/admit.vx as shipped</text><text x="286.0" y="120.0" font-size="12" text-anchor="end" fill="#656d76" font-weight="normal">reference program and machine files</text><rect x="300.0" y="90.0" width="420.0" height="26" fill="#cf222e" rx="2"/><text x="730.0" y="108.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">17 wrong · 111/128 agree</text><text x="286.0" y="160.0" font-size="14" text-anchor="end" fill="#1f2328" font-weight="600">exact checkpoint weights</text><text x="286.0" y="178.0" font-size="12" text-anchor="end" fill="#656d76" font-weight="normal">replace the 12·layers·d² estimate</text><rect x="300.0" y="148.0" width="271.8" height="26" fill="#cf222e" rx="2"/><text x="581.8" y="166.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">11 wrong · 117/128 agree</text><text x="286.0" y="218.0" font-size="14" text-anchor="end" fill="#1f2328" font-weight="600">device capacity</text><text x="286.0" y="236.0" font-size="12" text-anchor="end" fill="#656d76" font-weight="normal">what CUDA reports, not the spec sheet</text><rect x="300.0" y="206.0" width="271.8" height="26" fill="#cf222e" rx="2"/><text x="581.8" y="224.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">11 wrong · 117/128 agree</text><text x="286.0" y="276.0" font-size="14" text-anchor="end" fill="#1f2328" font-weight="600">vLLM's 8% reserve</text><text x="286.0" y="294.0" font-size="12" text-anchor="end" fill="#656d76" font-weight="normal">one extra tensor in the program</text><rect x="300.0" y="264.0" width="49.4" height="26" fill="#cf222e" rx="2"/><rect x="349.4" y="264.0" width="24.7" height="26" fill="#afb8c1" rx="2"/><text x="384.1" y="282.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">3 wrong · 125/128 agree</text><rect x="300.0" y="324.0" width="12.0" height="12" fill="#cf222e" rx="2"/><text x="318.0" y="335.0" font-size="12" text-anchor="start" fill="#656d76" font-weight="normal">Vx admits, vLLM cannot serve</text><rect x="520.0" y="324.0" width="12.0" height="12" fill="#afb8c1" rx="2"/><text x="538.0" y="335.0" font-size="12" text-anchor="start" fill="#656d76" font-weight="normal">Vx refuses, vLLM serves</text><text x="24.0" y="358.0" font-size="11.5" text-anchor="start" fill="#656d76" font-weight="normal">A100-40GB, A100-80GB, H100 · Qwen2.5 7B–32B · context 4k–32k × batch 1–64 · gpu_memory_utilization 0.92.</text></svg>
